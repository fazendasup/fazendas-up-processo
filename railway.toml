# Railway — config-as-code (combina com variáveis definidas no painel).
# Docs: https://docs.railway.app/reference/config-as-code
#
# Migrações Drizzle: dentro do Node após HTTP à escuta (`runDrizzleMigrateFromEnv`); `start.mjs` só arranca o servidor.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Sobrescreva só se precisar; o Dockerfile já usa `node scripts/start.mjs`.
startCommand = "node scripts/start.mjs"
healthcheckPath = "/healthz"
# Arranque pode demorar (MySQL a aquecer + migrações); margem extra além de /healthz precoce.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
