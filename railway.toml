# Railway — config-as-code (combina com variáveis definidas no painel).
# Docs: https://docs.railway.app/reference/config-as-code
#
# Migrações: `scripts/start.mjs` corre drizzle-kit migrate antes do servidor.
# drizzle-kit está em dependencies para `pnpm install --prod` na imagem.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Sobrescreva só se precisar; o Dockerfile já usa `node scripts/start.mjs`.
startCommand = "node scripts/start.mjs"
healthcheckPath = "/healthz"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
