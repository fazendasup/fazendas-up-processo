<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Finalizar com alcool gel 70 por cento">
  <rect width="200" height="160" rx="12" fill="#E8EAF6"/>
  <!-- alcohol gel bottle -->
  <rect x="25" y="40" width="38" height="70" rx="8" fill="#5C6BC0" stroke="#283593" stroke-width="2.5"/>
  <rect x="33" y="28" width="22" height="16" rx="4" fill="#3949AB" stroke="#283593" stroke-width="2"/>
  <rect x="38" y="18" width="12" height="14" rx="3" fill="#9FA8DA" stroke="#283593" stroke-width="1.5"/>
  <ellipse cx="44" y="75" rx="12" ry="18" fill="#9FA8DA" opacity=".5"/>
  <text x="44" y="68" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#FFF">70%</text>
  <text x="44" y="82" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="700" fill="#E8EAF6">GEL</text>
  <!-- gel blob on palm -->
  <ellipse cx="115" cy="95" rx="16" ry="12" fill="#9FA8DA" stroke="#5C6BC0" stroke-width="1.5" opacity=".85"/>
  <ellipse cx="112" cy="90" rx="6" ry="4" fill="#E8EAF6" opacity=".7"/>
  <!-- hands rubbing sanitizer -->
  <g stroke="#C68642" stroke-width="2.2" stroke-linejoin="round">
    <ellipse cx="105" cy="100" rx="40" ry="26" fill="#FFCC80" transform="rotate(-10 105 100)"/>
    <ellipse cx="72" cy="88" rx="7" ry="14" fill="#FFB74D" transform="rotate(-40 72 88)"/>
    <ellipse cx="85" cy="78" rx="6" ry="13" fill="#FFCC80" transform="rotate(-18 85 78)"/>
    <ellipse cx="100" cy="74" rx="6" ry="13" fill="#FFB74D"/>
    <ellipse cx="115" cy="78" rx="6" ry="12" fill="#FFCC80" transform="rotate(16 115 78)"/>
    <ellipse cx="145" cy="85" rx="28" ry="16" fill="#FFB74D" transform="rotate(40 145 85)" opacity=".92"/>
  </g>
  <!-- sparkle clean marks -->
  <path d="M155 45 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3 z" fill="#FFD54F"/>
  <path d="M175 70 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2 z" fill="#FFECB3"/>
  <text x="100" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#283593">ALCOOL GEL</text>
</svg>
