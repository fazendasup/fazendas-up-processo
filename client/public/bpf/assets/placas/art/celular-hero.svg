<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Proibido celular na area de producao">
  <rect width="400" height="280" fill="#FFEBEE"/>
  <rect x="16" y="16" width="368" height="248" rx="16" fill="#FFF" stroke="#EF9A9A" stroke-width="3"/>
  <!-- production bench background -->
  <rect x="40" y="175" width="200" height="50" rx="6" fill="#BCAAA4" stroke="#8D6E63" stroke-width="2"/>
  <text x="140" y="205" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#5D4037">BANCADA</text>
  <!-- worker trying to use phone -->
  <g stroke="#5D4037" stroke-width="2">
    <circle cx="110" cy="85" r="28" fill="#FFCC80"/>
    <ellipse cx="110" cy="68" rx="26" ry="12" fill="#FFF" stroke="#90A4AE" stroke-width="2"/>
    <circle cx="102" cy="82" r="3" fill="#5D4037" stroke="none"/>
    <circle cx="118" cy="82" r="3" fill="#5D4037" stroke="none"/>
    <path d="M102 95 q8 6 16 0" fill="none" stroke-linecap="round"/>
    <path d="M80 120 h60 l12 70 h-84 z" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
    <!-- arm holding phone -->
    <path d="M140 135 q40 5 55 35" fill="none" stroke="#FFCC80" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- phone in hand -->
  <rect x="175" y="145" width="38" height="62" rx="6" fill="#263238" stroke="#000" stroke-width="2" transform="rotate(15 194 176)"/>
  <rect x="180" y="152" width="28" height="42" rx="2" fill="#90CAF9" transform="rotate(15 194 176)"/>
  <circle cx="194" cy="200" r="3" fill="#546E7A" transform="rotate(15 194 176)"/>
  <!-- prohibition over phone use -->
  <circle cx="195" cy="155" r="70" fill="none" stroke="#C62828" stroke-width="12"/>
  <line x1="145" y1="105" x2="245" y2="205" stroke="#C62828" stroke-width="12" stroke-linecap="round"/>
  <!-- OK: locker aside -->
  <g transform="translate(280,55)">
    <rect x="0" y="20" width="70" height="95" rx="6" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
    <rect x="10" y="32" width="50" height="35" rx="3" fill="#8D6E63"/>
    <circle cx="50" cy="80" r="6" fill="#FFD54F"/>
    <circle cx="35" cy="12" r="14" fill="#2E7D32"/>
    <path d="M28 12 l5 5 10-11" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#2E7D32">OK: ARMARIO</text>
    <!-- tiny phone in locker -->
    <rect x="22" y="40" width="14" height="22" rx="2" fill="#263238"/>
  </g>
  <rect x="70" y="240" width="180" height="18" rx="5" fill="#C62828"/>
  <text x="160" y="253" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFF">CELULAR PROIBIDO</text>
</svg>
