<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Conferir posto e padrao com checklist">
  <rect width="200" height="160" rx="12" fill="#E8F5E9"/>
  <!-- clipboard -->
  <rect x="45" y="25" width="90" height="110" rx="8" fill="#FFF8E1" stroke="#8D6E63" stroke-width="3"/>
  <rect x="70" y="16" width="40" height="18" rx="4" fill="#6D4C41"/>
  <!-- checklist -->
  <g font-family="sans-serif" font-size="8" font-weight="700" fill="#1B5E20">
    <rect x="58" y="45" width="14" height="14" rx="3" fill="#2E7D32"/>
    <path d="M61 52 l3 3 6-7" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="78" y="56">Touca OK</text>
    <rect x="58" y="68" width="14" height="14" rx="3" fill="#2E7D32"/>
    <path d="M61 75 l3 3 6-7" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="78" y="79">Avental</text>
    <rect x="58" y="91" width="14" height="14" rx="3" fill="#2E7D32"/>
    <path d="M61 98 l3 3 6-7" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="78" y="102">Botas</text>
    <rect x="58" y="114" width="14" height="14" rx="3" fill="#FF9800"/>
    <text x="65" y="125" text-anchor="middle" fill="#FFF" font-size="10">!</text>
    <text x="78" y="125" fill="#E65100">Avisar?</text>
  </g>
  <!-- magnifying glass / inspection -->
  <circle cx="160" cy="55" r="18" fill="none" stroke="#1565C0" stroke-width="4"/>
  <line x1="172" y1="68" x2="185" y2="85" stroke="#1565C0" stroke-width="5" stroke-linecap="round"/>
  <text x="100" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#1B5E20">CONFERIR POSTO</text>
</svg>
