<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Aplicar sabao nas palmas">
  <rect width="200" height="160" rx="12" fill="#E8F5E9"/>
  <!-- soap dispenser -->
  <rect x="28" y="35" width="36" height="55" rx="6" fill="#66BB6A" stroke="#2E7D32" stroke-width="2.5"/>
  <rect x="36" y="22" width="20" height="18" rx="4" fill="#43A047" stroke="#2E7D32" stroke-width="2"/>
  <ellipse cx="46" y="18" rx="8" ry="5" fill="#81C784" stroke="#2E7D32" stroke-width="1.5"/>
  <path d="M46 40 v12" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <text x="46" y="72" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#FFF">SABAO</text>
  <!-- soap drop falling -->
  <ellipse cx="70" cy="55" rx="8" ry="10" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1.5"/>
  <path d="M70 45 q4 -8 0 -12" fill="none" stroke="#66BB6A" stroke-width="2" stroke-linecap="round"/>
  <!-- palms up receiving soap -->
  <g stroke="#C68642" stroke-width="2.2" stroke-linejoin="round">
    <!-- left palm -->
    <ellipse cx="100" cy="105" rx="38" ry="28" fill="#FFCC80" transform="rotate(-12 100 105)"/>
    <ellipse cx="72" cy="88" rx="8" ry="16" fill="#FFB74D" transform="rotate(-40 72 88)"/>
    <ellipse cx="84" cy="78" rx="7" ry="15" fill="#FFCC80" transform="rotate(-20 84 78)"/>
    <ellipse cx="98" cy="74" rx="7" ry="15" fill="#FFB74D"/>
    <ellipse cx="112" cy="78" rx="7" ry="14" fill="#FFCC80" transform="rotate(18 112 78)"/>
    <ellipse cx="124" cy="88" rx="7" ry="13" fill="#FFB74D" transform="rotate(35 124 88)"/>
  </g>
  <!-- lather on palm -->
  <ellipse cx="105" cy="100" rx="14" ry="10" fill="#C8E6C9" stroke="#66BB6A" stroke-width="1.5" opacity=".95"/>
  <circle cx="98" cy="95" r="5" fill="#FFF" stroke="#81C784" stroke-width="1.2"/>
  <circle cx="112" cy="102" r="4" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
  <circle cx="108" cy="90" r="3.5" fill="#FFF" opacity=".9"/>
  <!-- right hand squeezing / applying -->
  <g stroke="#C68642" stroke-width="2">
    <ellipse cx="155" cy="70" rx="22" ry="14" fill="#FFB74D" transform="rotate(55 155 70)"/>
  </g>
  <text x="100" y="152" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#2E7D32">APLICAR SABAO</text>
</svg>
