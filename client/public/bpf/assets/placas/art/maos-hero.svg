<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Pessoa lavando as maos na pia">
  <rect width="400" height="280" fill="#E3F2FD"/>
  <!-- wall tiles -->
  <g stroke="#BBDEFB" stroke-width="1" fill="none" opacity=".7">
    <path d="M0 40 H400 M0 80 H400 M0 120 H400 M0 160 H400"/>
    <path d="M50 0 V180 M100 0 V180 M150 0 V180 M200 0 V180 M250 0 V180 M300 0 V180 M350 0 V180"/>
  </g>
  <!-- backsplash -->
  <rect x="0" y="150" width="400" height="20" fill="#90A4AE"/>
  <!-- sink counter -->
  <rect x="40" y="170" width="260" height="70" rx="8" fill="#78909C" stroke="#546E7A" stroke-width="3"/>
  <ellipse cx="170" cy="200" rx="95" ry="32" fill="#607D8B"/>
  <ellipse cx="170" cy="200" rx="70" ry="20" fill="#81D4FA" opacity=".9"/>
  <!-- faucet -->
  <rect x="155" y="95" width="28" height="55" rx="6" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <rect x="130" y="85" width="78" height="22" rx="8" fill="#546E7A" stroke="#263238" stroke-width="2"/>
  <rect x="162" y="145" width="14" height="22" rx="3" fill="#37474F"/>
  <!-- water -->
  <path d="M169 167 v28" stroke="#29B6F6" stroke-width="7" stroke-linecap="round"/>
  <path d="M160 170 v22" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <path d="M178 170 v22" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <!-- person 3/4 at sink -->
  <g stroke="#5D4037" stroke-width="2.5" stroke-linejoin="round">
    <!-- torso / apron -->
    <path d="M255 155 c0-18 18-32 42-32 s40 14 40 32 v95 h-82 z" fill="#1565C0"/>
    <path d="M270 165 h52 v55 h-52 z" fill="#0D47A1"/>
    <!-- head -->
    <circle cx="297" cy="100" r="32" fill="#FFCC80"/>
    <ellipse cx="297" cy="78" rx="30" ry="14" fill="#FFF" stroke="#90A4AE" stroke-width="2"/>
    <circle cx="288" cy="98" r="3.5" fill="#5D4037" stroke="none"/>
    <circle cx="308" cy="98" r="3.5" fill="#5D4037" stroke="none"/>
    <path d="M290 112 q7 6 14 0" fill="none" stroke-linecap="round"/>
    <!-- arms washing -->
    <path d="M255 175 q-40 10 -55 35" fill="none" stroke="#FFCC80" stroke-width="16" stroke-linecap="round"/>
    <path d="M337 175 q35 8 45 32" fill="none" stroke="#FFB74D" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- hands under water -->
  <ellipse cx="155" cy="205" rx="28" ry="16" fill="#FFCC80" stroke="#C68642" stroke-width="2" transform="rotate(-25 155 205)"/>
  <ellipse cx="195" cy="208" rx="28" ry="16" fill="#FFB74D" stroke="#C68642" stroke-width="2" transform="rotate(20 195 208)"/>
  <!-- soap bubbles -->
  <circle cx="165" cy="185" r="7" fill="#FFF" stroke="#4FC3F7" stroke-width="1.5"/>
  <circle cx="185" cy="178" r="5" fill="#FFF" stroke="#81D4FA" stroke-width="1.5"/>
  <circle cx="200" cy="192" r="6" fill="#E1F5FE" stroke="#29B6F6" stroke-width="1.5"/>
  <!-- soap dispenser -->
  <rect x="250" y="155" width="28" height="22" rx="4" fill="#66BB6A" stroke="#2E7D32" stroke-width="2"/>
  <rect x="258" y="145" width="12" height="12" rx="2" fill="#43A047" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="264" y="170" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="700" fill="#1B5E20">SABAO</text>
  <!-- label -->
  <rect x="20" y="248" width="170" height="22" rx="6" fill="#1565C0"/>
  <text x="105" y="263" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFF">LAVE AS MAOS</text>
</svg>
